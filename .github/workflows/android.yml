name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build generic release APKs
        run: ./gradlew --no-daemon --stacktrace assembleGenericRelease

      - name: Sign release APKs
        uses: ilharp/sign-android-release@nightly
        with:
          releaseDir: app/build/outputs/apk/generic/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: app/build/outputs/apk/generic/release/*-signed.apk
          if-no-files-found: error
          retention-days: 20

      - name: Publish signed ARM64 APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_id }}
          name: Android APK Build ${{ github.run_number }}
          body: |
            Automatically generated signed Android APK.

            Download the ARM64 APK from the Assets section.
          files: app/build/outputs/apk/generic/release/*arm64-v8a*-signed.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
