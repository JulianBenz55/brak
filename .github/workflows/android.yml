name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: gradle assembleRelease

      - name: Sign app APK
        id: sign_app
        uses: ilharp/sign-android-release@nightly
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Keep the Actions artifact as a secondary download/backup.
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: app/build/outputs/apk/release/*-arm64-v8a-release-signed.apk
          if-no-files-found: error
          retention-days: 20

      # Publish the same signed APK as a public GitHub Release.
      # Anyone can download release assets from a public repository
      # without signing in to GitHub.
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Android APK Build ${{ github.run_number }}
          body: |
            Automatically generated Android APK.

            Download the signed ARM64 APK from the Assets section below.
          files: app/build/outputs/apk/release/*-arm64-v8a-release-signed.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
