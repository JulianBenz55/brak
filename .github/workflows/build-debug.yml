name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

# Required so the workflow can publish a public GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # Build the same ARM64 debug APK that is already working in Actions.
      - name: Build single arm64 debug APK
        run: ./gradlew --no-daemon --stacktrace -PnoSplits assembleGenericDebug

      - name: Upload debug APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seal-debug-arm64
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Do not publish releases from pull requests.
      - name: Publish APK as public GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}-${{ github.run_attempt }}
          name: Seal Android APK #${{ github.run_number }}
          body: |
            Automatically built ARM64 Android APK.

            Download the APK from the Assets section below.
          files: app/build/outputs/apk/generic/debug/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
