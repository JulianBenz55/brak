name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # Build only the configured ABI (ABI_FILTERS=arm64-v8a).
      # This disables the four ABI splits and the additional universal APK.
      - name: Build single arm64 debug APK
        run: ./gradlew --no-daemon --stacktrace -PnoSplits assembleGenericDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Seal-debug-arm64
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
          retention-days: 14
